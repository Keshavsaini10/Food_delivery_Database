syntax = "proto3";

package pricing;

// Implemented by the restaurants service, called by orders.
service PricingService {
  rpc GetPricing (GetPricingRequest) returns (GetPricingResponse);
}

message OrderItem {
  string menu_item_id = 1;
  int32 quantity = 2;
}

message GetPricingRequest {
  string restaurant_id = 1;
  repeated OrderItem items = 2;
}

message PricedItem {
  string menu_item_id = 1;
  string name = 2;
  int32 quantity = 3;
  int64 unit_price_minor = 4; // smallest currency unit (paise)
  bool available = 5;
}

message GetPricingResponse {
  repeated PricedItem items = 1;
  int64 subtotal_minor = 2;
  int64 delivery_fee_minor = 3;
  int64 total_minor = 4;
  string currency = 5; // e.g. "INR"
  bool all_available = 6;
}
